# Depth Effect + Life Calendar wallpaper settings.
# Your birth date is NOT stored here; it comes from the BIRTH_DATE repo secret.

device = "iphone_17_pro_max"   # 1320x2868 (iPhone 16/17 Pro Max)
timezone = "Asia/Kolkata"      # decides which "today" the grid counts to
lifespan_years = 90            # thelifecalendar.com default ("xx% to 90")

[grid]
# thelifecalendar.com Year Calendar ("Days"): 365 dots, today in orange,
# "<n>d left · <p>%". view = "life" switches to the 90-year weeks grid.
view = "year"
layer = "front"            # "front": grid over the photo, always visible; "behind": subject covers it
scale = 0.68               # 1.0 = their exact size (fills 28-85% of the screen)
caption_baseline = 0.86    # caption sits here (fraction of height); grid stacks above it
shadow = true              # soft shadow so white dots read over snow / bright sky
show_caption = true

[selection]
max_candidates = 300     # photos segmented per run (each ~10-20 s on Actions CPU)
time_budget_min = 40     # stop searching after this long; the pool is topped up from yesterday
max_upscale = 1.15       # never enlarge the source more than this
apex_target = 0.225      # subject top lands here (fraction of height)
min_clock_cover = 0.10   # subject must cover at least this much of the numerals' height...
max_clock_cover = 0.35   # ...and at most this much, or iOS turns Depth Effect off
min_area = 0.08          # subject share of the frame
max_area = 0.65
frag_band = 0.06         # band below the apex checked for broken outlines
max_frag_pieces = 3
max_thin_ratio = 0.35
max_clock_bg_std = 0.20  # background behind the clock must be calm
max_clock_bg_edges = 0.55

[pool]
# Each night renders `size` wallpapers to gh-pages/w/1.jpg .. w/<size>.jpg;
# the iPhone Shortcut picks one at random every time it runs.
size = 8
dark_luma = 0.36          # mean brightness (0 black .. 1 white) below this counts as "dark"
min_dark_share = 0.75     # at least this share of the pool must be dark
space_share = 0.30        # aim for this share of space imagery (rest landscapes)

[sources]
max_est_luma = 0.62       # drop photos whose source-reported average colour is brighter

[sources.landscape]
# EarthPorn-style scenery with a clear focal form that can rise into the
# clock; weighted toward night, blue hour and moody light.
queries = [
  "milky way mountain", "night mountain stars", "moody mountains", "blue hour mountain",
  "aurora mountain", "volcano night", "dark mountain peak", "mountain peak",
  "dolomites", "patagonia mountains", "lone tree night", "sea stack night",
  "matterhorn", "fitz roy", "iceland mountain", "storm mountain",
]
wikimedia_categories = [
  "Featured pictures of landscapes", "Featured pictures of mountains",
  "Featured pictures of rock formations", "Featured pictures of volcanoes",
  "Featured pictures of glaciers", "Featured pictures of coasts",
]

[sources.space]
# Real imagery and artistic renders. Depth Effect still needs a subject
# (planet, moon, rocket, station) rising into the clock.
queries = [
  "planet earth from space", "moon surface", "space art planet", "saturn",
  "rocket launch night", "planet render", "nebula planet art", "eclipse",
]
nasa_queries = [
  "artist concept exoplanet", "earthrise", "saturn cassini", "jupiter juno",
  "moon surface", "rocket launch night", "international space station earth",
  "artist concept planet", "mars rover landscape", "earth from orbit night",
]
wikimedia_categories = ["Featured pictures of astronomy", "Featured pictures of the Moon", "Featured pictures of planets"]

[sources.unsplash]
queries_per_run = 6       # per kind, rotated daily
pages = 1

[sources.pexels]
queries_per_run = 6

[sources.wikimedia]
categories_per_run = 6

[sources.nasa]
queries_per_run = 10

[sources.reddit]
# Dormant unless REDDIT_CLIENT_ID/SECRET are approved keys.
subreddits = ["EarthPorn", "SkyPorn", "WaterPorn", "AutumnPorn", "WinterPorn", "DesertPorn"]
sort = "hot"
limit = 50
